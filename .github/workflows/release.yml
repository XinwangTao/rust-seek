name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build windows-${{ matrix.arch }}
    runs-on: windows-latest
    # 单条架构腿失败（如交叉编译工具链问题）不再连累整次发布；
    # 产物缺失时 latest.json 会少对应架构，自动更新只在该架构上跳过。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        shell: bash
        run: |
          pkg=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml=$pkg tag=$tag"
          if [ -n "$tag" ] && [ "$pkg" != "$tag" ]; then
            echo "::error::Cargo.toml 版本 $pkg 与 tag $tag 不一致；发布出去的包会自报旧版本，客户端将反复提示更新"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rust-seek.exe" out/
          Copy-Item README.md out/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE* out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath "rust-seek_${ver}_windows_${{ matrix.arch }}.zip"
          # 自动更新用：裸 exe + 单架构 sha256（release job 汇总成 latest.json）
          Copy-Item "target/${{ matrix.target }}/release/rust-seek.exe" "rust-seek_${ver}_windows_${{ matrix.arch }}.exe"
          $sha = (Get-FileHash "rust-seek_${ver}_windows_${{ matrix.arch }}.exe" -Algorithm SHA256).Hash.ToLower()
          "$sha  rust-seek_${ver}_windows_${{ matrix.arch }}.exe" | Out-File -Encoding ascii "sha256_${{ matrix.arch }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-seek-windows-${{ matrix.arch }}
          path: |
            rust-seek_*.zip
            rust-seek_*.exe
            sha256_*.txt
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # build 腿带 continue-on-error，这里的校验才是真正拦住发布的闸门
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        run: |
          pkg=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml=$pkg tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Cargo.toml 版本 $pkg 与 tag $tag 不一致，拒绝发布"
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose latest.json
        shell: bash
        env:
          VER: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          ver = os.environ["VER"].lstrip("vV")
          repo = os.environ["REPO"]
          keys = {"x64": "x86_64", "arm64": "aarch64"}
          assets = {}
          for f in sorted(glob.glob("dist/sha256_*.txt")):
              arch = os.path.basename(f).replace("sha256_", "").replace(".txt", "")
              sha = open(f).read().split()[0].strip().lower()
              name = f"rust-seek_{ver}_windows_{arch}.exe"
              if not os.path.exists(f"dist/{name}"):
                  print(f"::warning::missing {name}")
                  continue
              assets[keys[arch]] = {
                  "url": f"https://github.com/{repo}/releases/download/v{ver}/{name}",
                  "sha256": sha,
              }
          if not assets:
              raise SystemExit("no update assets found")
          json.dump({"version": ver, "notes": f"详见 https://github.com/{repo}/releases/tag/v{ver}", "assets": assets}, open("dist/latest.json", "w"), indent=2)
          print(open("dist/latest.json").read())
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          # 预发布 tag（v5.2.0-rc1 之类）不能成为 releases/latest，
          # 否则所有正式用户都会被提示升级到测试版
          prerelease: ${{ contains(github.ref_name, '-') }}
