[package]
name = "rust-seek"
version = "4.9.0"
edition = "2021"
description = "A high-performance file and text search tool"

[dependencies]
eframe = "0.31"
egui = "0.31"
regex = "1"
ignore = "0.4"
memmap2 = "0.9"
anyhow = "1"
num_cpus = "1"
rfd = "0.15"
open = "5.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
encoding_rs = "0.8.35"
global-hotkey = "0.9.0"
tray-icon = "0.26.1"
winreg = "0.56.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[build-dependencies]
winresource = "0.1"
